<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08111f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Crypto Radar" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Crypto Radar</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        let applied = false
        const setNativeValue = (el, value) => {
          const proto = el instanceof HTMLSelectElement ? HTMLSelectElement.prototype : HTMLInputElement.prototype
          const setter = Object.getOwnPropertyDescriptor(proto, 'value')?.set
          setter?.call(el, value)
          el.dispatchEvent(new Event('input', { bubbles: true }))
          el.dispatchEvent(new Event('change', { bubbles: true }))
        }
        const applyDefaultChartWindow = () => {
          if (applied) return
          const dates = document.querySelectorAll('input[type="date"]')
          const selects = [...document.querySelectorAll('select')]
          const interval = selects.find((el) => [...el.options].some((o) => o.value === '1d') && [...el.options].some((o) => o.value === '1w'))
          if (dates.length < 2 || !interval) return
          const today = new Date()
          const from = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000)
          const iso = (d) => d.toISOString().slice(0, 10)
          setNativeValue(dates[0], iso(from))
          setNativeValue(dates[1], iso(today))
          setNativeValue(interval, '1d')
          applied = true
          observer.disconnect()
        }
        const observer = new MutationObserver(applyDefaultChartWindow)
        observer.observe(document.documentElement, { childList: true, subtree: true })
        window.addEventListener('DOMContentLoaded', applyDefaultChartWindow, { once: true })
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
