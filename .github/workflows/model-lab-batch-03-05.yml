name: Model Lab Batch 03-05

on:
  push:
    paths:
      - '.github/workflows/model-lab-batch-03-05.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run iterations 03 to 05
        run: |
          python model-lab/iteration03.py
          python model-lab/iteration04.py
          python model-lab/iteration05.py
      - name: Save results
        run: |
          git config user.name "crypto-radar-model-lab"
          git config user.email "actions@users.noreply.github.com"
          git add model-lab/results/iteration03.md model-lab/results/iteration04.md model-lab/results/iteration05.md
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Model lab: save batch iterations 03-05"
            git push
          fi
