name: Model Lab Iterations 15-17

on:
  push:
    paths:
      - 'model-lab/iteration15_17.py'
      - '.github/workflows/model-lab-iteration15-17.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run iterations 15-17
        run: python model-lab/iteration15_17.py
      - name: Save results
        run: |
          git config user.name "crypto-radar-model-lab"
          git config user.email "actions@users.noreply.github.com"
          git add model-lab/results/iteration15.md model-lab/results/iteration16.md model-lab/results/iteration17.md
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Model lab: save iterations 15-17 results"
            git push
          fi
