name: Model Lab Deep BUY Sweep

on:
  workflow_dispatch:
  push:
    paths:
      - 'model-lab/buy_deep_sweep.py'
      - '.github/workflows/model-lab-buy-deep-sweep.yml'

permissions:
  contents: write

jobs:
  buy-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deep BUY sweep
        run: python model-lab/buy_deep_sweep.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model-lab/results/buy_deep_sweep.md
          git diff --cached --quiet || git commit -m "Model lab: save deep BUY sweep results"
          git push
