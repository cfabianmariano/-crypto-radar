name: Model Lab Iteration 05

on:
  push:
    paths:
      - 'model-lab/iteration05.py'
      - '.github/workflows/model-lab-iteration05.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run iteration 05
        run: python model-lab/iteration05.py
      - name: Save result
        run: |
          git config user.name "crypto-radar-model-lab"
          git config user.email "actions@users.noreply.github.com"
          git add model-lab/results/iteration05.md
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Model lab: save iteration 05 results"
            git push
          fi
