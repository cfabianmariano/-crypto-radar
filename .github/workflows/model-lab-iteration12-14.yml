name: Model Lab Iterations 12-14

on:
  push:
    paths:
      - 'model-lab/iteration12_14.py'
      - '.github/workflows/model-lab-iteration12-14.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run iterations 12-14
        run: python model-lab/iteration12_14.py
      - name: Save results
        run: |
          git config user.name "crypto-radar-model-lab"
          git config user.email "actions@users.noreply.github.com"
          git add model-lab/results/iteration12.md model-lab/results/iteration13.md model-lab/results/iteration14.md
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Model lab: save iterations 12-14 results"
            git push
          fi
