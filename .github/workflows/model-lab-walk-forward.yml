name: Model Lab Walk Forward

on:
  workflow_dispatch:
  push:
    paths:
      - 'model-lab/walk_forward_candidates.py'
      - '.github/workflows/model-lab-walk-forward.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run walk-forward validation
        run: python model-lab/walk_forward_candidates.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model-lab/results/walk_forward_candidates.md
          git diff --cached --quiet || git commit -m "Model lab: save walk-forward candidate results"
          git push
