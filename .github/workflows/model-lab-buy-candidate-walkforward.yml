name: Model Lab BUY Candidate Walk-forward

on:
  workflow_dispatch:
  push:
    paths:
      - 'model-lab/buy_candidate_walkforward.py'
      - '.github/workflows/model-lab-buy-candidate-walkforward.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen BUY candidate
        run: python model-lab/buy_candidate_walkforward.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model-lab/results/buy_candidate_walkforward.md
          git diff --cached --quiet || git commit -m "Model lab: save frozen BUY walk-forward result"
          git push
